# Local development override: exposes the API on the host, enables experimental profiles and
# serves the full stack through Caddy on http://localhost:8080.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  caddy:
    ports: !override
      - "127.0.0.1:8080:80"
  api:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RELEASEPROOF_ENV: dev
      RELEASEPROOF_EXPOSE_EXPERIMENTAL: "1"
