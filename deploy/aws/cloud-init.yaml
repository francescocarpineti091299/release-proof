#cloud-config
# ReleaseProof host bootstrap (Ubuntu 24.04 LTS, amd64 / AMD EPYC).
# Installs Docker Engine + compose plugin from Docker's apt repository and prepares
# /opt/releaseproof for deploy.sh (rsync + docker compose up -d --build).

package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - rsync
  - jq

write_files:
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "5" },
        "live-restore": true
      }
  - path: /etc/sysctl.d/90-releaseproof.conf
    permissions: "0644"
    content: |
      fs.inotify.max_user_watches=524288
      vm.max_map_count=262144

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - sysctl --system
  - install -d -o ubuntu -g ubuntu -m 0755 /opt/releaseproof
  - touch /var/lib/releaseproof-bootstrap-done

final_message: "ReleaseProof bootstrap finished after $UPTIME seconds"
