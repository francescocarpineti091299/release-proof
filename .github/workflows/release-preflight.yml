name: Firmware migration preflight

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Explicit completed LIVE run ID
        required: true
        type: string
      configuration:
        description: Expected configuration ID
        required: true
        type: string
      change:
        description: Expected change ID
        required: true
        type: string
      plan:
        description: Expected plan ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./backend
      - name: Verify evidence and enforce preflight policy
        env:
          RP_BASE: ${{ vars.RELEASEPROOF_BASE_URL }}
          RP_RUN: ${{ inputs.run_id }}
          RP_CONFIG: ${{ inputs.configuration }}
          RP_CHANGE: ${{ inputs.change }}
          RP_PLAN: ${{ inputs.plan }}
        run: >-
          python scripts/release_gate.py --base "$RP_BASE" --run-id "$RP_RUN"
          --configuration "$RP_CONFIG" --change "$RP_CHANGE" --plan "$RP_PLAN"
          --out releaseproof-gate
      - name: Retain decision and evidence, including blocked runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: releaseproof-preflight
          path: releaseproof-gate/
          if-no-files-found: warn
          retention-days: 7
